// Project64 設定檔：Lenovo ThinkPad T14 Gen 2 (AMD, 20YE)
// Ryzen 5 5600U / Radeon Vega 7 內顯 / 16GB RAM / 1920x1080 60Hz / Realtek 音效
//
// 用法：Project64「檔案 > 匯入設定檔...」選這個檔案，然後重新啟動。
// 只會覆寫下面列出的項目，其他設定（ROM 目錄、快捷鍵、手把按鍵等）維持不變。

[Plugin]
// 內建影像外掛比 GLideN64 輕量，在 AMD 內顯的 OpenGL 驅動上相容性也比較穩
Graphics Dll=GFX\Project64-Video.dll
Audio Dll=Audio\Project64-Audio.dll
RSP Dll=RSP\Project64-RSP.dll
Controller Dll=Input\Project64-Input.dll

[Video]
// 視窗模式 960x720（索引 9）：4:3 比例，加上選單和狀態列也放得進 1080p 螢幕
resolution=9
// 螢幕是 60Hz，開垂直同步避免畫面撕裂
vsync=1
// Vega 7 跑非等向性過濾幾乎沒有負擔，貼圖在斜角時會清楚很多
wrpAnisotropic=1
// 用 FBO 做 framebuffer 效果（暫停畫面、動態模糊、光暈等），比讀回主記憶體快很多
wrpFBO=1
// 0 = 自動偵測顯示記憶體（內顯和系統共用記憶體，讓驅動決定）
wrpVRAM=0
fb_smart=1
fb_hires=1

[Defaults]
// 用音效同步速度，加上固定音效時序，在筆電上最不容易出現爆音或斷音
Audio-Sync Audio=1
Fixed Audio=1

[Settings]
// 視窗最小化時自動暫停，省電
Auto Sleep=1
// 關掉 Discord 狀態同步，少一個背景連線
Enable Discord RPC=0
